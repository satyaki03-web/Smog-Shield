name: smog_shield
description: >-
  Smog Shield helps families and communities navigate winter smog and urban air
  pollution with tailored routines, indoor air actions, and sustainable swaps.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: 6.2.1
  http: 1.2.2
  provider: 6.1.2
  share_plus: 10.0.2
  shared_preferences: 2.3.2

dev_dependencies:
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter
  mocktail: 1.0.4

flutter:
  uses-material-design: true
